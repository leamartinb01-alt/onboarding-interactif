<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Accès équipe · Écosystème Viral</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a08;--or:#ff7a3d;--or2:#ff9a52;--tx:#dcd2c7;--tx2:#a89c90;--wh:#f6efe7}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;color:var(--tx);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 420px at 50% -8%,rgba(255,138,69,.22),rgba(255,122,61,0) 66%),var(--bg)}
.box{width:100%;max-width:420px;background:linear-gradient(180deg,#241a13,#130d09);border:1.5px solid rgba(255,122,61,.72);
  border-radius:18px;padding:30px 26px;text-align:center}
.kick{font-size:11px;letter-spacing:.3em;font-weight:800;color:var(--or2);text-transform:uppercase}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;color:#fff;font-size:34px;margin-top:10px;line-height:1.05}
p{font-size:14px;color:var(--tx2);margin-top:10px}
form{margin-top:22px;display:flex;flex-direction:column;gap:10px}
input{background:#180f0a;border:1.5px solid rgba(255,255,255,.13);border-radius:11px;color:var(--wh);padding:13px 14px;font:inherit;font-size:16px;text-align:center}
input:focus{outline:none;border-color:rgba(255,122,61,.72)}
button{background:linear-gradient(135deg,#ff6a2b,#ff9a52);border:0;border-radius:11px;color:#1a0f09;font:inherit;font-weight:800;font-size:15px;padding:13px;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.pwrow{position:relative}
.pwrow input{width:100%;padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;color:var(--tx2);cursor:pointer;border-radius:8px}
.eye:hover{color:var(--or2)}
.eye .slash{display:none}
.eye.on .slash{display:inline}
.err{min-height:20px;font-size:13px;color:#ff8f6a;margin-top:4px}
</style>
</head>
<body>
<div class="box">
  <div class="kick">Écosystème Viral · Document interne</div>
  <h1>Accès équipe</h1>
  <p>Ce parcours est réservé à l'équipe. Entre le mot de passe pour y accéder.</p>
  <form id="f">
    <div class="pwrow">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" autofocus>
      <button type="button" class="eye" id="eye" aria-label="Afficher le mot de passe" title="Afficher le mot de passe">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg>
      </button>
    </div>
    <button id="go" type="submit">Entrer</button>
    <div class="err" id="err"></div>
  </form>
</div>

const u8 = b => Uint8Array.from(atob(b), ch => ch.charCodeAt(0));
async function open_(pw, quiet){
  try{
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(pw.trim().toUpperCase()), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(D.s), iterations:310000, hash:"SHA-256"},
                base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(D.i)}, key, u8(D.c)));
    try{ sessionStorage.setItem("ev_pw", pw); }catch(e){}
    document.open(); document.write(html); document.close();
    return true;
  }catch(e){
    if(!quiet) document.getElementById("err").textContent = "Mot de passe incorrect.";
    return false;
  }
}
document.getElementById("eye").addEventListener("click", ()=>{
  const i = document.getElementById("pw"), e = document.getElementById("eye");
  const show = i.type === "password";
  i.type = show ? "text" : "password";
  e.classList.toggle("on", show);
  e.setAttribute("aria-label", show ? "Masquer le mot de passe" : "Afficher le mot de passe");
  e.title = e.getAttribute("aria-label");
  i.focus();
});
document.getElementById("f").addEventListener("submit", async ev=>{
  ev.preventDefault();
  const b = document.getElementById("go"); b.disabled = true; b.textContent = "Ouverture…";
  document.getElementById("err").textContent = "";
  if(!await open_(document.getElementById("pw").value)){ b.disabled = false; b.textContent = "Entrer"; }
});
(async()=>{ let s = null; try{ s = sessionStorage.getItem("ev_pw"); }catch(e){} if(s) await open_(s, true); })();
